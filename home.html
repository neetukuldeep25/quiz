<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        #welcome h1 {
            margin-bottom: 15px;
        }

        #welcome p {
            color: gray;
            line-height: 1.5;
        }

        #welcontainer h3 {
            margin: 25px 0 15px;
        }

        #startBtn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #startBtn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="welcoome">

            <h1>🧠 Welcome to Quiz App!</h1>

            <p>Test your knowledge, challenge yourself, and learn something new.</p>

            <h3>Are you ready?</h3>

            <button id="startBtn">Start Quiz</button>

        </div>
    </div>
    <script src="node.js"></script>

</body>

</html>
